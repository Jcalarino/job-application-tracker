{% extends 'base.html' %}
{% block title %}{{ 'Add' if mode == 'add' else 'Edit' }} Job - Job Tracker{% endblock %}

{% block content %}
<h1 class="page-title">{{ 'Add Job' if mode == 'add' else 'Edit Job' }}</h1>

<form method="post" class="app-form" novalidate>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="company_id" class="form-label">Company *</label>
      <select class="form-select" id="company_id" name="company_id" required>
        <option value="">Choose a company...</option>
        {% for c in companies %}
          <option value="{{ c.company_id }}" {% if job.company_id == c.company_id %}selected{% endif %}>
            {{ c.company_name }}
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6 mb-3">
      <label for="job_title" class="form-label">Job title *</label>
      <input type="text" class="form-control" id="job_title" name="job_title"
             maxlength="100" required value="{{ job.job_title }}">
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label for="job_type" class="form-label">Job type</label>
      <select class="form-select" id="job_type" name="job_type">
        <option value="">Not specified</option>
        {% for t in job_types %}
          <option value="{{ t }}" {% if job.job_type == t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4 mb-3">
      <label for="salary_min" class="form-label">Minimum salary ($)</label>
      <input type="number" min="0" class="form-control" id="salary_min" name="salary_min"
             value="{{ job.salary_min }}">
    </div>
    <div class="col-md-4 mb-3">
      <label for="salary_max" class="form-label">Maximum salary ($)</label>
      <input type="number" min="0" class="form-control" id="salary_max" name="salary_max"
             value="{{ job.salary_max }}">
    </div>
  </div>

  <div class="row">
    <div class="col-md-8 mb-3">
      <label for="job_url" class="form-label">Job posting URL</label>
      <input type="text" class="form-control" id="job_url" name="job_url"
             maxlength="300" value="{{ job.job_url }}">
    </div>
    <div class="col-md-4 mb-3">
      <label for="date_posted" class="form-label">Date posted</label>
      <input type="date" class="form-control" id="date_posted" name="date_posted"
             value="{{ job.date_posted }}">
    </div>
  </div>

  <hr>
  <h2 class="h5 mb-3">Requirements <span class="text-muted fw-normal">(used by Job Match)</span></h2>

  <div class="mb-3">
    <label for="required_skills" class="form-label">Required skills</label>
    <input type="text" class="form-control" id="required_skills" name="required_skills"
           placeholder="Python, SQL, Flask" value="{{ job.required_skills }}">
    <div class="form-text">Separate skills with commas.</div>
  </div>

  <div class="mb-3">
    <label for="preferred_skills" class="form-label">Preferred skills</label>
    <input type="text" class="form-control" id="preferred_skills" name="preferred_skills"
           placeholder="Docker, AWS" value="{{ job.preferred_skills }}">
  </div>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label for="experience_years" class="form-label">Years of experience</label>
      <input type="number" min="0" class="form-control" id="experience_years"
             name="experience_years" value="{{ job.experience_years }}">
    </div>
    <div class="col-md-5 mb-3">
      <label for="education" class="form-label">Education</label>
      <input type="text" class="form-control" id="education" name="education"
             value="{{ job.education }}">
    </div>
    <div class="col-md-3 mb-3 d-flex align-items-end">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="remote_option" name="remote_option"
               {% if job.remote_option %}checked{% endif %}>
        <label class="form-check-label" for="remote_option">Remote option</label>
      </div>
    </div>
  </div>

  <button type="submit" class="btn btn-primary">{{ 'Add Job' if mode == 'add' else 'Save Changes' }}</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('jobs') }}">Cancel</a>
</form>
{% endblock %}
