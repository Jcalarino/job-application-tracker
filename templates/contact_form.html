{% extends 'base.html' %}
{% block title %}{{ 'Add' if mode == 'add' else 'Edit' }} Contact - Job Tracker{% endblock %}

{% block content %}
<h1 class="page-title">{{ 'Add Contact' if mode == 'add' else 'Edit Contact' }}</h1>

<form method="post" class="app-form" novalidate>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="contact_name" class="form-label">Name *</label>
      <input type="text" class="form-control" id="contact_name" name="contact_name"
             maxlength="100" required value="{{ contact.contact_name or '' }}">
    </div>
    <div class="col-md-6 mb-3">
      <label for="title" class="form-label">Title</label>
      <input type="text" class="form-control" id="title" name="title"
             maxlength="100" placeholder="Technical Recruiter" value="{{ contact.title or '' }}">
    </div>
  </div>

  <div class="mb-3">
    <label for="company_id" class="form-label">Company *</label>
    <select class="form-select" id="company_id" name="company_id" required>
      <option value="">Choose a company...</option>
      {% for c in companies %}
        <option value="{{ c.company_id }}" {% if contact.company_id == c.company_id %}selected{% endif %}>
          {{ c.company_name }}
        </option>
      {% endfor %}
    </select>
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="text" class="form-control" id="email" name="email"
             maxlength="100" placeholder="name@company.com" value="{{ contact.email or '' }}">
    </div>
    <div class="col-md-6 mb-3">
      <label for="phone" class="form-label">Phone</label>
      <input type="text" class="form-control" id="phone" name="phone"
             maxlength="20" placeholder="305-555-0101" value="{{ contact.phone or '' }}">
    </div>
  </div>

  <div class="mb-3">
    <label for="linkedin_url" class="form-label">LinkedIn URL</label>
    <input type="text" class="form-control" id="linkedin_url" name="linkedin_url"
           maxlength="200" placeholder="https://linkedin.com/in/..." value="{{ contact.linkedin_url or '' }}">
  </div>

  <div class="mb-3">
    <label for="notes" class="form-label">Notes</label>
    <textarea class="form-control" id="notes" name="notes" rows="3">{{ contact.notes or '' }}</textarea>
  </div>

  <button type="submit" class="btn btn-primary">{{ 'Add Contact' if mode == 'add' else 'Save Changes' }}</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('contacts') }}">Cancel</a>
</form>
{% endblock %}
